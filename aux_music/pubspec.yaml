name: aux_music
description: "Aux — Free, unlimited music and podcast streaming. Powered entirely by open sources."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Embedded Node.js Server ────────────────────────────────────────
  node_flutter: ^0.0.4

  # ── State Management ──────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Playback ──────────────────────────────────────────────────────
  just_audio: ^0.9.42
  audio_service: ^0.18.16
  audio_session: ^0.1.21

  # ── Local Persistence ─────────────────────────────────────────────
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.0
  sqlite3: ^2.4.1
  sqlite3_flutter_libs: ^0.5.24

  # ── Network ───────────────────────────────────────────────────────
  dio: ^5.7.0

  # ── Images ────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+4

  # ── Fonts ─────────────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Firebase ──────────────────────────────────────────────────────
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7

  # ── Utilities ─────────────────────────────────────────────────────
  speech_to_text: ^7.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0
  equatable: ^2.0.7
  rxdart: ^0.28.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  flutter_svg: ^2.0.16
  package_info_plus: ^8.1.3
  xml: ^6.6.1
  youtube_explode_dart:
    git:
      url: https://github.com/Hexer10/youtube_explode_dart.git
  encrypt: ^5.0.3
  socket_io_client: ^3.1.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  google_sign_in: ^6.2.2
  # NOTE: RSS/podcast parsing (dart_rss or similar) will be added in Phase 1

  # when the podcast adapter is implemented. Deferred to avoid intl conflicts.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  drift_dev: ^2.22.2
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/Aux_applogo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-VariableFont.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Sora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sora-Bold.ttf
          weight: 700
